apiVersion: v1
kind: Namespace
metadata:
  name: katae1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: katae1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: kata
            - name: RABBITMQ_DEFAULT_PASS
              value: kata
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: katae1
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: ui
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  namespace: katae1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
        - name: usuarios
          image: katae1-usuarios:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: GCP_PROJECT_ID
              value: round-seeker-309101
            - name: RABBITMQ_URL
              value: amqp://kata:kata@rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
  namespace: katae1
spec:
  selector:
    app: usuarios
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: katae1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: katae1-front:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: katae1
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
